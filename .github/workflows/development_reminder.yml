name: Issue reminder & auto-unassign (projects v2)

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  remind-and-unassign:
    runs-on: ubuntu-latest
    env:
      PROJECT_STATUS_READY: 'Pronta para iniciar'
      PROJECT_STATUS_IN_DEV: 'Em desenvolvimento'
      PROJECT_FIELD_NAME: 'Status'
      MARKER: '<!-- issue-reminder-bot -->'
    steps:
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @octokit/rest @octokit/graphql

      - name: Run reminder script (supports Projects v2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_STATUS_READY: ${{ env.PROJECT_STATUS_READY }}
          PROJECT_STATUS_IN_DEV: ${{ env.PROJECT_STATUS_IN_DEV }}
          PROJECT_FIELD_NAME: ${{ env.PROJECT_FIELD_NAME }}
          MARKER: ${{ env.MARKER }}
        run: |
          cat > reminder_v2.js <<'JS'
          const { Octokit } = require('@octokit/rest');
          const { graphql } = require('@octokit/graphql');

          function normalizeName(s) {
            if (!s) return '';
            return s.normalize && s.normalize('NFD').replace(/\p{Diacritic}/gu, '').trim().toLowerCase();
          }

          (async () => {
            try {
              const repoFull = process.env.GITHUB_REPOSITORY;
              if (!repoFull) throw new Error('GITHUB_REPOSITORY not set');
              const [owner, repo] = repoFull.split('/');

              const READY = (process.env.PROJECT_STATUS_READY || 'Pronta para iniciar').trim();
              const INDEV = (process.env.PROJECT_STATUS_IN_DEV || 'Em desenvolvimento').trim();
              const FIELD_NAME = (process.env.PROJECT_FIELD_NAME || 'Status').trim();
              const marker = process.env.MARKER || '<!-- issue-reminder-bot -->';

              const now = new Date();
              const ONE_DAY = 24 * 60 * 60 * 1000;
              const TWO_DAYS = 2 * ONE_DAY;

              const issuesOctokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
              const graphqlWithAuth = graphql.defaults({ headers: { authorization: `token ${process.env.GITHUB_TOKEN}` } });

              const issueStatus = {};

              console.log('Buscando Projects v2 via GraphQL...');
              const projectsQuery = `query($owner:String!, $repo:String!, $itemsFirst:Int!) {
                repository(owner:$owner, name:$repo) {
                  projectsV2(first:100) {
                    nodes {
                      id
                      title
                      items(first:$itemsFirst) {
                        nodes {
                          id
                          content {
                            ... on Issue { number }
                          }
                          fieldValues(first:50) {
                            nodes {
                              __typename
                              ... on ProjectV2ItemFieldSingleSelectValue { projectField { name } name }
                              ... on ProjectV2ItemFieldTextValue { projectField { name } text }
                              ... on ProjectV2ItemFieldNumberValue { projectField { name } number }
                              ... on ProjectV2ItemFieldSingleSelectValues { projectField { name } names }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

              const res = await graphqlWithAuth({ query: projectsQuery, owner, repo, itemsFirst: 100 });
              const projects = (((res || {}).repository || {}).projectsV2 || {}).nodes || [];
              console.log(`Projects v2 encontrados: ${projects.length}`);

              for (const p of projects) {
                const items = (p.items && p.items.nodes) || [];
                for (const item of items) {
                  const issueNumber = item.content && item.content.number;
                  if (!issueNumber) continue;

                  const fieldVals = (item.fieldValues && item.fieldValues.nodes) || [];
                  for (const fv of fieldVals) {
                    const pfName = normalizeName((fv.projectField && fv.projectField.name) || '');
                    const targetField = normalizeName(FIELD_NAME);
                    if (pfName !== targetField) continue;

                    let val = null;
                    if (fv.__typename === 'ProjectV2ItemFieldSingleSelectValue') val = fv.name;
                    if (fv.__typename === 'ProjectV2ItemFieldTextValue') val = fv.text;
                    if (fv.__typename === 'ProjectV2ItemFieldNumberValue') val = fv.number && String(fv.number);
                    if (fv.__typename === 'ProjectV2ItemFieldSingleSelectValues') val = (fv.names && fv.names[0]) || null;

                    if (!val) continue;

                    const normVal = normalizeName(val);
                    if (normVal === normalizeName(READY)) {
                      if (issueStatus[issueNumber] === INDEV) continue;
                      issueStatus[issueNumber] = READY;
                    }
                    if (normVal === normalizeName(INDEV)) {
                      issueStatus[issueNumber] = INDEV;
                    }
                  }
                }
              }

              console.log(`Mapped ${Object.keys(issueStatus).length} issues from Projects v2 field '${FIELD_NAME}'.`);

              if (Object.keys(issueStatus).length === 0) {
                console.log('Nenhum mapping via Projects v2 — usando labels como fallback.');
                const allIssues = await issuesOctokit.paginate(issuesOctokit.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
                let count = 0;
                for (const issue of allIssues) {
                  if (issue.pull_request) continue;
                  const labels = (issue.labels || []).map(l => (l.name || '').trim().toLowerCase());
                  if (labels.includes(READY.toLowerCase())) { issueStatus[issue.number] = READY; count++; }
                  if (labels.includes(INDEV.toLowerCase())) { issueStatus[issue.number] = INDEV; }
                }
                console.log(`Fallback labels mapped ${count} issues.`);
              }

              const issues = await issuesOctokit.paginate(issuesOctokit.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
              for (const issue of issues) {
                if (issue.pull_request) continue;
                const num = issue.number;
                if (issueStatus[num] !== READY) {
                  console.log(`#${num}: status não é '${READY}' (é: ${issueStatus[num] || 'nenhum'}) — pulando.`);
                  continue;
                }

                const assignees = (issue.assignees || []).map(a => a.login);

                const commentsResp = await issuesOctokit.rest.issues.listComments({ owner, repo, issue_number: num, per_page: 200 });
                const comments = commentsResp.data || [];
                const botComments = comments.filter(c => c.body && c.body.includes(marker));
                const lastBotComment = botComments.sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];

                let assigneeCommentedAfter = false;
                if (assignees.length > 0) {
                  const afterTime = lastBotComment ? new Date(lastBotComment.created_at) : null;
                  for (const c of comments) {
                    if (afterTime && new Date(c.created_at) <= afterTime) continue;
                    if (assignees.includes(c.user.login)) {
                      assigneeCommentedAfter = true;
                      break;
                    }
                  }
                }

                if (!lastBotComment) {
                  const body = `${marker}\nOlá ${assignees.length ? `@${assignees[0]}` : '@assignee'}, esta issue está no status **${READY}** — por favor, coloque-a em **${INDEV}** em até 24 horas ou confirme que continuará com ela.`;
                  await issuesOctokit.rest.issues.createComment({ owner, repo, issue_number: num, body });
                  console.log(`Primeiro lembrete postado em #${num}`);
                  continue;
                }

                const lastBotDate = new Date(lastBotComment.created_at);
                const diff = now - lastBotDate;

                if (diff < ONE_DAY) { console.log(`#${num}: lembrete recente (<24h)`); continue; }

                if (diff >= ONE_DAY && diff < TWO_DAYS) {
                  if (assigneeCommentedAfter) { console.log(`#${num}: assignee respondeu depois do lembrete`); continue; }
                  const body = `${marker}\nSegunda chamada para ${assignees.length ? `@${assignees[0]}` : '@assignee'}: esta issue ainda não foi movida para **${INDEV}**. Por favor, confirme que irá começar.`;
                  await issuesOctokit.rest.issues.createComment({ owner, repo, issue_number: num, body });
                  console.log(`Segunda chamada postada em #${num}`);
                  continue;
                }

                if (diff >= TWO_DAYS) {
                  if (assignees.length === 0) { console.log(`#${num}: sem assignees`); continue; }
                  if (assigneeCommentedAfter) { console.log(`#${num}: assignee interagiu`); continue; }
                  await issuesOctokit.rest.issues.removeAssignees({ owner, repo, issue_number: num, assignees });
                  const body = `${marker}\nComo não houve progresso em 48 horas, removi ${assignees.map(a=>`@${a}`).join(', ')}. Reatribua-se se quiser assumir novamente.`;
                  await issuesOctokit.rest.issues.createComment({ owner, repo, issue_number: num, body });
                  console.log(`Assignees removidos de #${num}`);
                }
              }

            } catch (err) {
              console.error('Erro no script:', err);
              process.exit(1);
            }
          })();
          JS

          node reminder_v2.js
